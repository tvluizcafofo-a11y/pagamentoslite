<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sistema de Pagamentos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="mb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ag" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="ao" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Recibo (topo do terminal) -->
  <g>
    <path d="M 150 70 L 270 70 L 270 210 L 150 210 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 150 210 L 162 200 L 174 210 L 186 200 L 198 210 L 210 200 L 222 210 L 234 200 L 246 210 L 258 200 L 270 210"
          fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linejoin="round"/>
    <line x1="172" y1="100" x2="248" y2="100" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <line x1="172" y1="125" x2="248" y2="125" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <line x1="172" y1="150" x2="248" y2="150" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    <line x1="172" y1="175" x2="220" y2="175" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Terminal POS -->
  <g>
    <rect x="70" y="185" width="210" height="270" rx="26" fill="#0f172a"/>
    <rect x="80" y="195" width="190" height="250" rx="18" fill="url(#body)"/>
    <rect x="100" y="215" width="150" height="95" rx="10" fill="#0f172a"/>
    <rect x="106" y="221" width="138" height="83" rx="6" fill="url(#scr)"/>

    <!-- Teclado 3x2 -->
    <g fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5">
      <rect x="100" y="325" width="44" height="30" rx="6"/>
      <rect x="153" y="325" width="44" height="30" rx="6"/>
      <rect x="206" y="325" width="44" height="30" rx="6"/>
      <rect x="100" y="362" width="44" height="30" rx="6"/>
      <rect x="153" y="362" width="44" height="30" rx="6"/>
      <rect x="206" y="362" width="44" height="30" rx="6"/>
    </g>

    <!-- Botões coloridos -->
    <rect x="100" y="399" width="44" height="30" rx="6" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>
    <rect x="153" y="399" width="44" height="30" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="2.5"/>
    <rect x="206" y="399" width="44" height="30" rx="6" fill="#22c55e" stroke="#166534" stroke-width="2.5"/>
  </g>

  <!-- Cédulas -->
  <g transform="translate(255, 250)">
    <!-- Laranja (atrás) -->
    <g transform="rotate(16 100 60)">
      <rect x="30" y="20" width="140" height="86" rx="10" fill="url(#mo)" stroke="#b45309" stroke-width="4"/>
      <rect x="42" y="32" width="116" height="62" rx="5" fill="none" stroke="#fbbf24" stroke-width="3"/>
    </g>
    <!-- Azul (meio) -->
    <g transform="rotate(8 95 55)">
      <rect x="22" y="30" width="140" height="86" rx="10" fill="url(#mb)" stroke="#1e40af" stroke-width="4"/>
      <rect x="34" y="42" width="116" height="62" rx="5" fill="none" stroke="#93c5fd" stroke-width="3"/>
    </g>
    <!-- Verde (frente) -->
    <g>
      <rect x="14" y="40" width="140" height="86" rx="10" fill="url(#mg)" stroke="#15803d" stroke-width="4"/>
      <rect x="26" y="52" width="116" height="62" rx="5" fill="none" stroke="#86efac" stroke-width="3"/>
      <circle cx="84" cy="83" r="24" fill="none" stroke="#ffffff" stroke-width="4"/>
      <text x="84" y="97" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
    </g>
  </g>

  <!-- Setas (canto superior direito) -->
  <g transform="translate(355, 55)">
    <path d="M 45 145 L 45 60 L 15 60 L 60 5 L 105 60 L 75 60 L 75 145 Z"
          fill="url(#ag)" stroke="#14532d" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(405, 95)">
    <path d="M 30 100 L 30 40 L 10 40 L 42 0 L 74 40 L 54 40 L 54 100 Z"
          fill="url(#ao)" stroke="#9a3412" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Offline — Sistema de Pagamentos</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
  .cartao{max-width:420px;width:100%;background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.25);border-radius:18px;padding:28px 24px;
    text-align:center;backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,.35)}
  h1{margin:0 0 10px;font-size:1.4rem;font-weight:900;letter-spacing:.3px}
  p{margin:0 0 18px;font-size:.95rem;opacity:.9;line-height:1.5}
  .emoji{font-size:3.2rem;display:block;margin-bottom:8px}
  button{font:inherit;font-weight:800;cursor:pointer;border:none;
    background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;
    padding:12px 22px;border-radius:12px;font-size:.95rem;
    box-shadow:0 6px 18px rgba(234,88,12,.45)}
  button:active{transform:translateY(1px)}
  small{display:block;margin-top:14px;font-size:.75rem;opacity:.75}
</style>
</head>
<body>
  <div class="cartao">
    <span class="emoji">📡</span>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar. Seus dados continuam salvos <b>localmente</b> no dispositivo — reconecte para sincronizar a interface.</p>
    <button onclick="location.reload()">🔄 Tentar novamente</button>
    <small>Sistema de Pagamentos · modo offline</small>
  </div>
</body>
</html>
